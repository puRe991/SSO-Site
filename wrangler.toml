name = "team-fairy-tight"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# ---------------------------------------------------------------------------
# IMPORTANT: because this file sets `pages_build_output_dir`, Cloudflare Pages
# reads the project's bindings from HERE and ignores bindings configured in the
# dashboard. The database_id below must be a real id or the deployment fails.
#
#   npx wrangler d1 create tft-db      # prints the database_id
#
# Paste it in, commit, deploy. See DEPLOYMENT.md for the full walkthrough.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "tft-db"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"
migrations_dir = "migrations"

# No runtime [vars] are required. PUBLIC_SITE_URL is optional and only pins the
# canonical URL: when it is unset the site uses the origin of the incoming
# request, which is already correct on pages.dev, on previews and on a custom
# domain. Set it as a BUILD variable in the Pages dashboard, not here — it is
# read at build time, not at runtime.
