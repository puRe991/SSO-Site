# Cloudflare Workers configuration
# ================================
# The site deploys as a Worker with static assets. `dist/_worker.js/index.js` is
# the SSR entry produced by the Astro Cloudflare adapter; everything else in
# `dist/` is served straight from the CDN.
#
# Deploy with an explicit config path:
#
#   wrangler deploy --config wrangler.toml     (or: npm run deploy)
#
# The flag is not required, but it makes failures obvious. Without it, a config
# that still declares `pages_build_output_dir` only produces a warning ("you
# have run wrangler deploy on a Pages project"), auto-answers the confirmation
# prompt in CI, and then fails with the unrelated-looking "Missing entry-point
# to Worker script". With --config the same situation fails immediately and
# says what is wrong: "It looks like you've run a Workers-specific command in a
# Pages project." (Both paths verified against wrangler 4.131.1.)

# Must match the Worker in Cloudflare. Workers Builds derives it from the
# repository name and overrides a mismatch, warning on every build.
name = "sso-site"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Cloudflare D1. The database_id below must be a real id or the deployment has
# no database — the site then still renders, but every section stays empty.
#
#   npx wrangler d1 create tft-db      # prints the database_id
#
# See DEPLOYMENT.md for the full walkthrough.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "tft-db"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"
migrations_dir = "migrations"

# No runtime [vars] are required. PUBLIC_SITE_URL is optional and only pins the
# canonical URL: unset, the site uses the origin of the incoming request, which
# is already correct on workers.dev, on previews and on a custom domain. Set it
# as a BUILD variable — it is read at build time, not at runtime.
