name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:ci

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    runs-on: ubuntu-latest
    # Optional. Cloudflare's own Workers Builds (Git integration) is the default
    # path, see DEPLOYMENT.md. This job stays dormant unless the repository
    # variable DEPLOY_VIA_ACTIONS is "true" and the two secrets are set, so the
    # two deploy paths never race each other.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_VIA_ACTIONS == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
